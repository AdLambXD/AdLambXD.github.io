# Hexo 主配置文件
# 文档: https://hexo.io/docs/configuration.html

# 站点信息
title: AdLam
subtitle: '代码 · 生活 · 游戏'
description: '记录技术、生活与热爱的个人小站'
keywords: 技术笔记, 生活日记, 游戏, 作品集, AdLam
author: AdLam
language: zh-CN
timezone: 'Asia/Shanghai'

# 网址
url: https://adlambxd.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# 目录
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# 写作
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# 首页设置
index_generator:
  path: ''
  per_page: 8
  order_by: -date

# 归档
archive_generator:
  enabled: true
  per_page: 0
  yearly: true
  monthly: true
  daily: false

# 分类 & 标签
category_generator:
  per_page: 12
tag_generator:
  per_page: 12

# 本地搜索数据
search:
  path: search.xml
  field: post
  content: true
  format: html

# Markdown
marked:
  prependRoot: true
  postAsset: true
  modifyAnchors: 0
  autolink: true
  gfm: true

# 主题
theme: butterfly
